name: axels-spel
arch: amd64
platform: linux
version: ${VERSION}
maintainer: Daniel Nylander
description: Harbor Town Rollabout family driving and exploration game
homepage: https://github.com/yeager/harbortownrollabout
contents:
  - src: export/linux/axels-spel
    dst: /usr/lib/axels-spel/axels-spel
    file_info:
      mode: 0755
  - src: export/linux/axels-spel.pck
    dst: /usr/lib/axels-spel/axels-spel.pck
  - src: /usr/lib/axels-spel/axels-spel
    dst: /usr/bin/axels-spel
    type: symlink
  - src: packaging/linux/axels-spel.desktop
    dst: /usr/share/applications/axels-spel.desktop
  - src: branding/app-icon.png
    dst: /usr/share/pixmaps/axels-spel.png
