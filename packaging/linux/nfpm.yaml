name: harbortown
arch: amd64
platform: linux
version: ${VERSION}
license: GPL-3.0-only
maintainer: Daniel Nylander
description: Harbor Town Rollabout family driving and exploration game
homepage: https://github.com/yeager/harbortownrollabout
depends:
  - fontconfig
contents:
  - src: LICENSE
    dst: /usr/share/doc/harbortown/copyright
  - src: export/linux/harbortown
    dst: /usr/lib/harbortown/harbortown
    file_info:
      mode: 0755
  - src: export/linux/harbortown.pck
    dst: /usr/lib/harbortown/harbortown.pck
  - src: /usr/lib/harbortown/harbortown
    dst: /usr/bin/harbortown
    type: symlink
  - src: packaging/linux/harbortown.desktop
    dst: /usr/share/applications/harbortown.desktop
  - src: branding/app-icon.png
    dst: /usr/share/pixmaps/harbortown.png
