name: Game packages
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check translations, game logos and Linux launcher
        run: |
          if ! command -v msgcmp >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gettext
          fi
          sh tools/check_localizations.sh
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#v}
            [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          else
            base=$(sed -n 's/^config.version="\(.*\)"/\1/p' project.godot)
            version="$base-ci.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Install Godot and matching templates
        working-directory: ${{ runner.temp }}
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/4.7-dev5/Godot_v4.7-dev5
          curl -fLsS --retry 3 "${base}_linux.x86_64.zip" -o editor.zip
          curl -fLsS --retry 3 "${base}_export_templates.tpz" -o templates.zip
          echo '6ba71dd954b7d67a7d988b059df66ce053c32df48c918aeac8bb7e8e90598d6f  editor.zip' | sha256sum -c
          echo 'deb8774a04196eac7130beb5a11188e8715d1b1bd902a8573b9311a93a0031f5  templates.zip' | sha256sum -c
          unzip -q editor.zip
          mv Godot*_linux.x86_64 godot
          echo "$PWD" >> "$GITHUB_PATH"
          unzip -q templates.zip 'templates/linux_release.x86_64' 'templates/windows_release_x86_64.exe' 'templates/macos.zip' 'templates/version.txt'
          dir="$HOME/.local/share/godot/export_templates/$(tr -d '\r\n' < templates/version.txt)"
          mkdir -p "$dir"
          mv templates/* "$dir/"
      - name: Import game
        run: godot --headless --editor --import
      - name: Check walking animation and pedestrian grips
        timeout-minutes: 3
        shell: bash
        run: |
          godot --headless --script res://tests/player_gait.gd 2>&1 | tee "$RUNNER_TEMP/gait.log"
          if grep -E '^(SCRIPT )?ERROR:' "$RUNNER_TEMP/gait.log"; then exit 1; fi
      - name: Check gameplay scenarios before export
        timeout-minutes: 5
        shell: bash
        run: |
          for scene in vehicle_gallery_drive kiosk_and_shopper pump_prices bus_route weather_transition; do
            export XDG_DATA_HOME="$RUNNER_TEMP/game-tests/$scene"
            mkdir -p "$XDG_DATA_HOME"
            godot --headless --script "res://tests/$scene.gd" 2>&1 | tee "$XDG_DATA_HOME/result.log"
            if grep -E '^(SCRIPT )?ERROR:' "$XDG_DATA_HOME/result.log"; then exit 1; fi
          done
      - name: Export all platforms
        run: |
          mkdir -p export/{linux,windows,mac}
          godot --headless --export-release Linux export/linux/harbortown
          godot --headless --export-release Windows export/windows/harbortown.exe
          godot --headless --export-release macOS export/mac/harbortown.zip
          (cd export/linux && ./harbortown --headless --quit-after 360) 2>&1 | tee "$RUNNER_TEMP/game-startup.log"
          if grep -E '^(SCRIPT )?ERROR:' "$RUNNER_TEMP/game-startup.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: exports
          path: export/
  package:
    needs: export
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.export.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exports
          path: export
      - run: mkdir dist
      - if: runner.os == 'Linux'
        run: |
          chmod +x export/linux/harbortown
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
          for format in deb rpm; do
            "$(go env GOPATH)/bin/nfpm" package -f packaging/linux/nfpm.yaml -p "$format" -t "dist/harbortown-$VERSION-x86_64.$format"
          done
          install -m 644 branding/app-icon.png export/linux/harbortown.png
          tar -czf "dist/harbortown-$VERSION-linux-x86_64.tar.gz" -C export/linux .
      - name: Launch packaged Linux game on Ubuntu 22.04 and Fedora 43
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for distro in ubuntu:22.04 fedora:43; do
            docker run --rm -v "$PWD/dist:/packages:ro" "$distro" bash -euc '
              set -o pipefail
              smoke() {
                "$1" --headless --audio-driver Dummy --quit-after 360 2>&1 | tee /root/game-start.log
                grep -q "Godot Engine" /root/game-start.log
                if grep -Eq "^(SCRIPT )?ERROR:" /root/game-start.log; then exit 1; fi
              }
              if command -v dpkg >/dev/null; then
                apt-get update
                apt-get install -y --no-install-recommends /packages/*.deb
                smoke /usr/bin/harbortown
                mkdir /root/portable
                tar -xzf /packages/*.tar.gz -C /root/portable
                cmp /root/portable/harbortown.png /usr/share/pixmaps/harbortown.png
                smoke /root/portable/harbortown
              else
                dnf -y --setopt=install_weak_deps=False install /packages/*.rpm
                smoke /usr/bin/harbortown
              fi
            '
          done
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DGameVersion=$env:VERSION" packaging/windows/game.iss
          exit $LASTEXITCODE
      - name: Install and launch the Windows game
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-Item "dist/harbortown-$env:VERSION-windows-x64.exe"
          $dir = Join-Path $env:RUNNER_TEMP 'installed-game'
          $setup = Start-Process $installer.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LANG=sv /DIR=`"$dir`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)" }
          $log = Join-Path $env:RUNNER_TEMP 'windows-game.log'
          $game = Start-Process (Join-Path $dir 'harbortown.exe') -ArgumentList "--headless --quit-after 360 --log-file `"$log`"" -Wait -PassThru
          if ($game.ExitCode -ne 0 -or (Select-String -Path $log -Pattern '^(SCRIPT )?ERROR:')) { throw 'Installed game failed to start cleanly' }
      - if: runner.os == 'macOS'
        run: |
          for arch in x86_64 arm64; do
            image="image-$arch"
            mkdir "$image"
            ditto -x -k "export/mac/harbortown.zip" "$image"
            python3 packaging/macos/name_app.py "$image"
            app="$image/harbortown.app"
            test -s "$app/Contents/Resources/icon.icns"
            executable="$app/Contents/MacOS/harbortown"
            lipo "$executable" -thin "$arch" -output "$executable.thin"
            mv "$executable.thin" "$executable"
            chmod +x "$executable"
            codesign --force --deep --sign - "$app"
            ln -s /Applications "$image/Applications"
            dmg="dist/harbortown-$VERSION-macOS-$arch.dmg"
            hdiutil create -volname harbortown -srcfolder "$image" -format UDZO "$dmg"
            mount="$RUNNER_TEMP/harbortown-$arch"
            mkdir "$mount"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
            app="$mount/harbortown.app"
            codesign --verify --deep --strict "$app"
            executable="$app/Contents/MacOS/harbortown"
            test "$(lipo -archs "$executable")" = "$arch"
            "$executable" --headless --quit-after 360 2>&1 | tee "$RUNNER_TEMP/mac-game-$arch.log"
            if grep -E '^(SCRIPT )?ERROR:' "$RUNNER_TEMP/mac-game-$arch.log"; then exit 1; fi
            hdiutil detach "$mount"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
  release:
    needs: [export, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.export.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Publish six packages and checksums
        working-directory: dist
        run: |
          for arch in x86_64 arm64; do test -f "harbortown-${TAG#v}-macOS-$arch.dmg"; done
          for ext in exe deb rpm tar.gz; do test "$(find . -maxdepth 1 -name "*.$ext" | wc -l)" -eq 1; done
          sha256sum * > SHA256SUMS
          args=()
          if [[ "$TAG" == *-ci.* ]]; then args+=(--prerelease); fi
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes "${args[@]}"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber ./*
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
